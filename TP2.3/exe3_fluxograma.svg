<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
<title id="title">Fluxograma do algoritmo de multiplicação</title>
<desc id="desc">Inicialização de x, y, z com a, b, 0. O teste termina se y for zero, escolhe left se y for par e right se for ímpar. As atualizações voltam ao teste ou terminam em erro em caso de overflow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs>
<rect width="720" height="660" fill="white"/>
<g fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)">
<path d="M355 107 V169"/>
<path d="M255 260 C174 304 130 344 135 407"/>
<path d="M455 260 C535 304 574 344 580 407"/>
<path d="M200 409 L309 283"/>
<path d="M510 409 L401 283"/>
<path d="M355 287 V592"/>
<path d="M158 515 V592"/>
<path d="M576 515 V592"/>
</g>
<g fill="white" stroke="#333" stroke-width="1.3">
<ellipse cx="355" cy="54" rx="134" ry="53"/>
<ellipse cx="355" cy="228" rx="124" ry="59"/>
<ellipse cx="158" cy="461" rx="150" ry="54"/>
<ellipse cx="576" cy="461" rx="140" ry="54"/>
<ellipse cx="158" cy="626" rx="70" ry="33"/>
<ellipse cx="355" cy="626" rx="70" ry="33"/>
<ellipse cx="576" cy="626" rx="70" ry="33"/>
</g>
<g text-anchor="middle" fill="#111" font-family="Arial, sans-serif" font-size="20">
<text x="355" y="25">init</text><text x="355" y="235">skip</text>
<text x="158" y="434">left</text><text x="576" y="434">right</text>
<text x="158" y="633">error</text><text x="355" y="633">stop</text><text x="576" y="633">error</text>
<text x="105" y="562" font-size="18">overflow</text><text x="641" y="562" font-size="18">overflow</text>
</g>
<g fill="#111" font-family="Times New Roman, serif" font-size="23" font-style="italic" text-anchor="middle">
<text x="355" y="63">x, y, z ← a, b, 0</text>
<text x="158" y="470">x, y, z ← 2 ∗ x, y/2, z</text>
<text x="576" y="470">x, y, z ← x, y − 1, z + x</text>
<text x="78" y="324" font-size="20">y ≠ 0 ∧ <tspan font-style="normal">even</tspan>(y)</text>
<text x="615" y="309" font-size="20">y ≠ 0 ∧ <tspan font-style="normal">odd</tspan>(y)</text>
<text x="389" y="401" font-size="20">y = 0</text>
</g>
</svg>
